{% extends "base.html" %}
{% block title %}{{ i18n_dict["browser.title"] }} · {{ project_id }}{% endblock %}

{% block topbar %}
<nav class="crumbs">
  <a href="{{ url_for('project.projects_page') }}" data-i18n="nav.projects">项目</a>
  <span>/</span>
  <a href="{{ url_for('index.index_page', project_id=project_id) }}">{{ project_id }}</a>
  <span>/</span><strong data-i18n="browser.title">文件浏览</strong>
</nav>
{% endblock %}

{% block content %}
<section class="panel">
  <h1 data-i18n="browser.title">文件浏览</h1>
  <p class="muted" data-i18n="browser.specialHint">特殊文件仅在此查看，不进入组件编辑。</p>
  <div class="toolbar">
    <select id="br-pack">
      <option value="" data-i18n="browser.allPacks">全部包</option>
      <option value="behavior" data-i18n="browser.behavior">行为包</option>
      <option value="resource" data-i18n="browser.resource">资源包</option>
    </select>
    <input id="br-q" type="text" data-i18n-ph="browser.filter" placeholder="过滤路径">
  </div>
  <div class="split">
    <div class="file-list" id="file-list"></div>
    <div class="file-view" id="file-view">
      <p class="empty" data-i18n="browser.selectHint">选择左侧文件查看内容</p>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>window.PROJECT_ID = {{ project_id|tojson }};</script>
<script src="{{ url_for('static', filename='js/browser.js') }}?v={{ static_ver }}"></script>
{% endblock %}
